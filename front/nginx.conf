worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;   # écriture possible en non-root

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Dossiers temporaires dans /tmp (nécessaire pour tourner en non-root)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Healthcheck du front lui-même
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # Proxy /api/xxx -> http://api:5000/xxx  (pas de CORS nécessaire)
        # Le nom "api" est résolu via le DNS interne de Docker au moment de la
        # requête : nginx démarre même si l'api n'est pas encore prête.
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://api:5000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
